services:
  inference:
    build:
      context: ./inference
    # `deploy.resources.reservations.devices` is not honored by every Compose
    # implementation. `gpus: all` creates the Docker GPU device request used
    # by Docker Compose v2 on Linux hosts.
    gpus: all
    environment:
      # Change ONLY this line, then run: docker compose up -d --build inference
      OCR_MODEL_ID: datalab-to/surya-ocr-2 # alternative: dots-studio/dots.ocr
      OCR_VRAM_CAP_GIB: "18"
      # GB10/DGX Spark has UMA rather than reportable framebuffer VRAM. Leave
      # blank to derive the total from /proc/meminfo; set this only to override.
      OCR_UMA_TOTAL_MEMORY_GIB: ""
      # Explicitly bound persistent cache allocation. This avoids vLLM's
      # inaccurate automatic cache sizing on GB10 unified-memory systems.
      OCR_KV_CACHE_MIB: "4096"
      OCR_ENFORCE_EAGER: "true"
      OCR_MAX_MODEL_LEN: "4096"
      OCR_MAX_NUM_SEQS: "2"
      HF_HOME: /models
      HUGGINGFACE_HUB_CACHE: /models/hub
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hf-cache:/models
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 120s

  backend:
    build:
      context: ./backend
    environment:
      OCR_API_KEY: ${OCR_API_KEY:?set OCR_API_KEY in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      INFERENCE_BASE_URL: http://inference:8000
      MAX_INFERENCE_CONCURRENCY: "2"
      MAX_UPLOAD_MIB: "25"
      MAX_PDF_PAGES: "20"
      RESULT_TTL_SECONDS: "3600"
    depends_on:
      inference:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      OCR_API_KEY: ${OCR_API_KEY:?set OCR_API_KEY in .env}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  hf-cache:
