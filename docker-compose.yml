services:
  inference:
    build:
      context: ./inference
    # `deploy.resources.reservations.devices` is not honored by every Compose
    # implementation. `gpus: all` creates the Docker GPU device request used
    # by Docker Compose v2 on Linux hosts.
    gpus: all
    environment:
      # Change ONLY this line, then run: docker compose up -d --build inference
      OCR_MODEL_ID: dots-studio/dots.ocr # alternatives: dots-studio/dots.ocr, datalab-to/chandra-ocr-2
      OCR_VRAM_CAP_GIB: "18"
      # GB10/DGX Spark has UMA rather than reportable framebuffer VRAM. Leave
      # blank to derive the total from /proc/meminfo; set this only to override.
      OCR_UMA_TOTAL_MEMORY_GIB: ""
      # Explicitly bound persistent cache allocation. This avoids vLLM's
      # inaccurate automatic cache sizing on GB10 unified-memory systems.
      OCR_KV_CACHE_MIB: "4096"
      # CUDA graphs are worth roughly 2-4x on decode. Eager mode was a
      # memory workaround; the server reports ~58 GiB free at startup, so it is
      # only costing throughput. Set back to "true" if startup memory regresses.
      OCR_ENFORCE_EAGER: "false"
      # The model supports 131072 positions. 8192 left a full-page image within
      # ~700 tokens of the limit, where vLLM rejects the request and the whole
      # page fails. The allocated KV cache holds ~149k tokens, so this is free.
      OCR_MAX_MODEL_LEN: "24576"
      # Must match MAX_IMAGE_TOKENS on the backend.
      OCR_MAX_IMAGE_TOKENS: "8464"
      OCR_MAX_NUM_SEQS: "2"
      HF_HOME: /models
      HUGGINGFACE_HUB_CACHE: /models/hub
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in .env}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - hf-cache:/models
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'', timeout=3)"',
        ]
      interval: 20s
      timeout: 5s
      # dots.ocr can take several minutes to download custom code and load its
      # weights on first use.  Treating that normal warm-up as unhealthy makes
      # Compose stop the dependent API/frontend before vLLM can become ready.
      retries: 60
      start_period: 20m

  backend:
    build:
      context: ./backend
    environment:
      OCR_API_KEY: ${OCR_API_KEY:?set OCR_API_KEY in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      INFERENCE_BASE_URL: http://inference:8000
      MAX_INFERENCE_CONCURRENCY: "2"
      MAX_UPLOAD_MIB: "25"
      MAX_PDF_PAGES: "20"
      MAX_PAGE_DIMENSION: "2560"
      # PDFs were rendered at a fixed 2x matrix, i.e. 144 dpi, which is thin for
      # small print. The token budget below caps the result either way.
      MAX_PDF_DPI: "200"
      UPSTREAM_TIMEOUT_SECONDS: "300"
      RESULT_TTL_SECONDS: "3600"
      # Keep in step with OCR_MAX_MODEL_LEN above: the backend sizes every page
      # so image tokens plus generated tokens cannot overflow the served context.
      MAX_MODEL_LEN: "24576"
      TOKEN_BUDGET_MARGIN: "6144"
      UPSTREAM_MAX_ATTEMPTS: "3"
      # Documents use dots.ocr's layout task (tables, captions, reading order).
      # Cards use its plain OCR task: measured on the NID front train split, the
      # layout task collapses a card into run-on lines and loops on dense ones.
      DOTS_LAYOUT_PROMPT_ENABLED: "true"
      NID_LAYOUT_PROMPT_ENABLED: "false"
      # Anti-repetition sampling, tuned per document kind. On the NID front
      # train split, 1.30 took truncating pages from 14/40 to 0/40 and accuracy
      # from 86.7% to 90.8%; 1.50 was worse than both. The back stays at 1.05
      # because its MRZ contains long runs of '<' that are legitimately
      # repetitive and a token-level penalty shortens them.
      REPETITION_PENALTY: "1.05"
      NID_FRONT_REPETITION_PENALTY: "1.30"
      NID_BACK_REPETITION_PENALTY: "1.05"
      NID_PREPROCESS_ENABLED: "true"
      NID_RECTIFY_ENABLED: "true"
      NID_ILLUMINATION_ENABLED: "true"
      NID_DESKEW_ENABLED: "true"
      NID_TARGET_LONG_EDGE: "1600"
      NID_MIN_SHORT_EDGE: "900"
      NID_MAX_UPSCALE: "4"
      NID_BORDER_PX: "20"
      NID_CLAHE_CLIP_LIMIT: "2.0"
      NID_CLAHE_TILE_GRID_SIZE: "8"
      NID_UNSHARP_AMOUNT: "0.20"
      # CPU-only second opinion for fields that fail validation. No GPU cost.
      NID_VERIFY_ENABLED: "true"
      NID_SECOND_PASS_ENABLED: "false"
    depends_on:
      inference:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      OCR_API_KEY: ${OCR_API_KEY:?set OCR_API_KEY in .env}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  hf-cache:
